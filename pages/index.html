<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Urbano2 Grasshopper Template Files</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute("data-theme", prefersDark ? "dark" : "light");
      })();
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <header class="site-header">
      <div class="container">
        <div class="header-left">
          <a href="./" class="header-brand">
            <span class="header-logo" aria-hidden="true">U2</span>
            <h1>Urbano2 Grasshopper Template Files</h1>
          </a>
          <p class="subtitle">Directory listing of all <code>*.gh</code> files with full folder structure.</p>
        </div>
        <div class="theme-toggle" aria-live="polite">
          <span class="icon" aria-hidden="true">◐</span>
          <span id="theme-label">Auto</span>
        </div>
      </div>
    </header>

    <div class="app-layout container">
      <aside class="sidebar" aria-label="Repository metadata">
        <div class="sidebar-section">
          <h2>Repository</h2>
          <p class="sidebar-line"><span class="label">Files:</span> <span id="repo-stats">Loading...</span></p>
          <p class="sidebar-line"><span class="label">Branch:</span> <span id="branch-name">-</span></p>
          <p class="sidebar-line"><span class="label">Generated:</span> <span id="generated-at">-</span></p>
        </div>
      </aside>

      <main id="main-content" class="main-content" tabindex="-1">
        <section class="versions-section" aria-label="Grasshopper file index">
          <div class="section-header">
            <h2>Template Files</h2>
          </div>
          <p class="meta" id="meta">Loading...</p>
          <div id="tree-root" class="tree-root" aria-live="polite"></div>
        </section>
      </main>
    </div>

    <footer class="site-footer">
      <div class="container">
        <p>
          Documentation:
          <a href="https://docs.urbano.io/" target="_blank" rel="noopener noreferrer">Urbano Docs</a>
        </p>
      </div>
    </footer>

    <script src="app.js" defer></script>
  </body>
</html>
